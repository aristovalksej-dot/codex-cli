[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-cli"
version = "1.0.0"
description = "Full-featured AI-powered CLI agent for VDS — code, browse, manage files, and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "aristovalksej" },
]
keywords = ["cli", "ai", "codex", "agent", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.40",
    "lxml>=5.1.0",
]

[project.scripts]
codex = "codex_cli.main:main"
codex-cli = "codex_cli.main:main"

[project.urls]
Homepage = "https://github.com/aristovalksej-dot/codex-cli"

[tool.hatch.build.targets.wheel]
packages = ["codex_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
